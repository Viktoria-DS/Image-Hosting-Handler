services:
  app:
    build:
      context: .
      dockerfile: Dockerfile-poetry
    ports:
      - "8000:8000"
    volumes:
      - ./images:/app/images
      - ./logs:/app/logs
      - ./static:/app/static
    env_file: .env
    restart: always
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    depends_on:
      - app
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./images:/data/images
      - ./static:/data/static
      - ./logs:/var/log/nginx

  db:
    image: postgres:17-alpine
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./logs:/var/log/postgresql
volumes:
  db_data: