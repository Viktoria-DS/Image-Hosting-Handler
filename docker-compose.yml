services:
  app:
    build:
      context: .
      dockerfile: Dockerfile-poetry
    ports:
      - "8000:8000"
    volumes:
      - ./images:/app/images
      - ./logs:/app/logs
      - ./static:/app/static
    env_file:
      - .env

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    depends_on:
      - app
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./images:/data/images
      - ./static:/data/static
      - ./logs:/var/log/nginx